name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Discover which projects have package.json
  # ──────────────────────────────────────────────
  discover:
    name: Discover Projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project directories
        id: find
        run: |
          # Find all directories under projects/ that contain a package.json
          PROJECTS=$(find projects -name 'package.json' -not -path '*/node_modules/*' -exec dirname {} \; | jq -R . | jq -s .)
          echo "projects=${PROJECTS}" >> "$GITHUB_OUTPUT"
          echo "Found projects: ${PROJECTS}"

  # ──────────────────────────────────────────────
  # Lint — formatting, secrets, commit messages
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc if present
        id: nvmrc
        run: |
          if [ -f .nvmrc ]; then echo "node_version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version || '20' }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run Prettier check
        working-directory: ${{ matrix.project }}
        run: npx prettier --check .

      - name: Run lint
        working-directory: ${{ matrix.project }}
        run: |
          if npm run | grep -q " lint"; then
            npm run lint
          else
            echo "No lint script — skipping"
          fi

      - name: Check for accidentally committed secrets
        run: |
          # Block files with suspicious patterns (private keys, .env files)
          if git ls-files | grep -E '\.env$|\.pem$|\.key$|\.env\.local$'; then
            echo "::error ::Sensitive files detected in tracked files. Remove them and add to .gitignore."
            exit 1
          fi
          echo "✓ No sensitive files tracked"

      - name: Validate commit message format
        if: github.event_name == 'push'
        run: |
          COMMIT_MSG=$(git log --format=%B -n 1)
          # Allowed types: feat, fix, docs, test, refactor, chore, ci
          if ! echo "$COMMIT_MSG" | grep -qE '^(feat|fix|docs|test|refactor|chore|ci)(\(.+\))?: .+'; then
            echo "::warning ::Commit message does not follow convention: <type>: <desc>"
            echo "::warning ::Allowed types: feat, fix, docs, test, refactor, chore, ci"
          fi

  # ──────────────────────────────────────────────
  # Build — compile / bundle
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc if present
        id: nvmrc
        run: |
          if [ -f .nvmrc ]; then echo "node_version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version || '20' }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run typecheck
        working-directory: ${{ matrix.project }}
        run: |
          # Run tsc --noEmit if tsconfig.json exists
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json — skipping typecheck"
          fi

      - name: Run build
        working-directory: ${{ matrix.project }}
        run: |
          # Run build script if defined in package.json
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No build script in package.json — skipping"
          fi

  # ──────────────────────────────────────────────
  # Test — unit + integration
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc if present
        id: nvmrc
        run: |
          if [ -f .nvmrc ]; then echo "node_version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version || '20' }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: |
          if npm run | grep -q " test"; then
            npm test -- --coverage
          else
            echo "No test script in package.json — skipping"
          fi

      - name: Run smoke tests
        working-directory: ${{ matrix.project }}
        run: |
          if npm run | grep -q " test:smoke"; then
            npm run test:smoke
          else
            echo "No smoke test script — skipping"
          fi

  # ──────────────────────────────────────────────
  # PR label / size check
  # ──────────────────────────────────────────────
  pr-check:
    name: PR Compliance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR description is not empty
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "::error ::PR description is empty. Please describe your changes."
            exit 1
          fi
          echo "✓ PR description provided"

      - name: Check branch naming convention
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BRANCH="$HEAD_REF"
          if echo "$BRANCH" | grep -qE '^(feature|fix|hotfix|chore|docs|refactor|test)/[A-Za-z0-9._-]+'; then
            echo "✓ Branch name follows convention: $BRANCH"
          else
            echo "::error ::Branch '$BRANCH' does not follow naming convention."
            echo "::error ::Expected: <type>/<issue-id>-<desc>  (e.g., feature/OVI-10-ci-cd)"
            echo "::error ::Allowed types: feature, fix, hotfix, chore, docs, refactor, test"
            exit 1
          fi

      - name: Flag large PRs (>500 lines)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ADDITIONS=$(gh pr view ${{ github.event.number }} --json additions --jq '.additions')
          if [ "$ADITIONS" -gt 500 ]; then
            echo "::warning ::PR adds $ADITIONS lines. Consider splitting into smaller PRs."
          else
            echo "✓ PR size: $ADDITIONS additions"
          fi
