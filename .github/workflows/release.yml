name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # e.g., v1.0.0, v2.1.3

permissions:
  contents: write   # needed for creating GitHub Releases

jobs:
  discover:
    name: Discover Projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project directories
        id: find
        run: |
          PROJECTS=$(find projects -name 'package.json' -not -path '*/node_modules/*' -exec dirname {} \; | jq -R . | jq -s .)
          echo "projects=${PROJECTS}" >> "$GITHUB_OUTPUT"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc if present
        id: nvmrc
        run: |
          if [ -f .nvmrc ]; then echo "node_version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"; fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version || '20' }}
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Run tests (gate)
        working-directory: ${{ matrix.project }}
        run: |
          if npm run | grep -q " test"; then
            npm test
          else
            echo "No test script — skipping"
          fi

      - name: Build artifacts
        working-directory: ${{ matrix.project }}
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No build script — skipping"
          fi

      - name: Create GitHub Release
        if: matrix.project == 'projects/onboarding'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
