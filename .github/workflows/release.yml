name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # e.g., v1.0.0, v2.1.3

permissions:
  contents: write   # needed for creating GitHub Releases

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc if present
        id: nvmrc
        run: |
          if [ -f .nvmrc ]; then echo "node_version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"; fi

      - name: Detect Node.js project
        id: detect-node
        run: |
          if [ -f package.json ]; then
            echo "is_node=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_node=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.detect-node.outputs.is_node == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version || '20' }}
          cache: npm

      - name: Install dependencies
        if: steps.detect-node.outputs.is_node == 'true'
        run: npm ci

      - name: Run tests (gate)
        if: steps.detect-node.outputs.is_node == 'true'
        run: |
          if npm run | grep -q " test"; then
            npm test
          else
            echo "No test script — skipping"
          fi

      - name: Build artifacts
        if: steps.detect-node.outputs.is_node == 'true'
        run: |
          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No build script — skipping"
          fi

      - name: Echosystem — no package.json
        if: steps.detect-node.outputs.is_node == 'false'
        run: echo "No package.json detected — skipping Node build/test steps"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
